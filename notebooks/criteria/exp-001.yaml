# exp-001's H1 as notebooks/analyze_exp001.py judges it (H1_P99_FACTOR = 2.0): the median p99 at
# the highest load within 2x of the median p99 at zero load, and the median loss there no more
# than 0.5 points above zero load's. Typed intent for vxedge results verdict (decisions X-24, X-25).
kind: experiment
id: exp-001
hypothesis: { id: H1, statement: The ADAS slice keeps p99 within 2x of idle under infotainment load. }
parameters:
  load_mbps: { type: integer, unit: Mbit/s, default: 0, min: 0, max: 1000 }
metrics:
  - { id: p99, kind: gauge, unit: s, entity: measurements/probe, series: vxprobe_rtt_seconds,
      labels: { quantile: "0.99" } }
  - { id: lost, kind: counter, unit: "1", entity: measurements/probe, series: vxprobe_lost_total }
  - { id: sent, kind: counter, unit: "1", entity: measurements/probe, series: vxprobe_sent_total }
  - { id: loss_pct, kind: gauge, unit: "%", entity: measurements/probe, ratio: [lost, sent],
      factor: 100 }
criteria:
  - id: h1
    all:
      - id: h1-p99
        lhs: { metric: p99, aggregate: median, select: { load_mbps: 600 } }
        op: le
        rhs: { metric: p99, aggregate: median, select: { load_mbps: 0 }, factor: 2.0 }
      - id: h1-loss
        lhs: { metric: loss_pct, aggregate: median, select: { load_mbps: 600 } }
        op: le
        rhs: { metric: loss_pct, aggregate: median, select: { load_mbps: 0 }, offset: 0.5 }
campaign:
  sweep: { load_mbps: [0, 100, 250, 400, 600] }
