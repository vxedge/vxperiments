# exp-002b's four decompositions as notebooks/analyze_exp002b.py judges them: each pair MATTERS
# (pass) when the median p50s differ by more than the larger IQR (at least 1 µs), and is
# UNRELIABLE (inconclusive) when either arm lost more than 1 % in any repetition (LOSS_WARN_PCT).
kind: experiment
id: exp-002b
metrics:
  # vxprobe exports cumulative quantiles; a trial's value is the last sample, which equals the
  # probe-summary.json the notebook reads.
  - { id: p50, kind: gauge, unit: s, entity: measurements/probe, series: vxprobe_rtt_seconds,
      labels: { quantile: "0.5" } }
  - { id: lost, kind: counter, unit: "1", entity: measurements/probe, series: vxprobe_lost_total }
  - { id: sent, kind: counter, unit: "1", entity: measurements/probe, series: vxprobe_sent_total }
  - { id: loss_pct, kind: gauge, unit: "%", entity: measurements/probe, ratio: [lost, sent],
      factor: 100 }
criteria:
  - id: transport
    op: outside
    lhs: { metric: p50, aggregate: median, select: { arm: microvm-pci } }
    rhs: { metric: p50, aggregate: median, select: { arm: microvm-mmio } }
    tolerance: { max: [{ metric: p50, aggregate: iqr, select: { arm: microvm-pci } }, { metric: p50, aggregate: iqr, select: { arm: microvm-mmio } }, { value: 0.000001, unit: s }] }
    guards:
      - { id: transport-microvm-pci-loss, op: le, lhs: { metric: loss_pct, aggregate: max, select: { arm: microvm-pci } },
          rhs: { value: 1.0, unit: "%" } }
      - { id: transport-microvm-mmio-loss, op: le, lhs: { metric: loss_pct, aggregate: max, select: { arm: microvm-mmio } },
          rhs: { value: 1.0, unit: "%" } }
  - id: machine
    op: outside
    lhs: { metric: p50, aggregate: median, select: { arm: q35-pci } }
    rhs: { metric: p50, aggregate: median, select: { arm: microvm-pci } }
    tolerance: { max: [{ metric: p50, aggregate: iqr, select: { arm: q35-pci } }, { metric: p50, aggregate: iqr, select: { arm: microvm-pci } }, { value: 0.000001, unit: s }] }
    guards:
      - { id: machine-q35-pci-loss, op: le, lhs: { metric: loss_pct, aggregate: max, select: { arm: q35-pci } },
          rhs: { value: 1.0, unit: "%" } }
      - { id: machine-microvm-pci-loss, op: le, lhs: { metric: loss_pct, aggregate: max, select: { arm: microvm-pci } },
          rhs: { value: 1.0, unit: "%" } }
  - id: vhost-net
    op: outside
    lhs: { metric: p50, aggregate: median, select: { arm: q35-vhost } }
    rhs: { metric: p50, aggregate: median, select: { arm: q35-pci } }
    tolerance: { max: [{ metric: p50, aggregate: iqr, select: { arm: q35-vhost } }, { metric: p50, aggregate: iqr, select: { arm: q35-pci } }, { value: 0.000001, unit: s }] }
    guards:
      - { id: vhost-net-q35-vhost-loss, op: le, lhs: { metric: loss_pct, aggregate: max, select: { arm: q35-vhost } },
          rhs: { value: 1.0, unit: "%" } }
      - { id: vhost-net-q35-pci-loss, op: le, lhs: { metric: loss_pct, aggregate: max, select: { arm: q35-pci } },
          rhs: { value: 1.0, unit: "%" } }
  - id: management
    op: outside
    lhs: { metric: p50, aggregate: median, select: { arm: libvirt-q35 } }
    rhs: { metric: p50, aggregate: median, select: { arm: q35-pci } }
    tolerance: { max: [{ metric: p50, aggregate: iqr, select: { arm: libvirt-q35 } }, { metric: p50, aggregate: iqr, select: { arm: q35-pci } }, { value: 0.000001, unit: s }] }
    guards:
      - { id: management-libvirt-q35-loss, op: le, lhs: { metric: loss_pct, aggregate: max, select: { arm: libvirt-q35 } },
          rhs: { value: 1.0, unit: "%" } }
      - { id: management-q35-pci-loss, op: le, lhs: { metric: loss_pct, aggregate: max, select: { arm: q35-pci } },
          rhs: { value: 1.0, unit: "%" } }
campaign:
  arms: { container: {}, microvm-mmio: {}, libvirt-q35: {}, q35-pci: {}, q35-vhost: {}, microvm-pci: {} }
