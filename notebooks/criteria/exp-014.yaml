# exp-014's verdict as notebooks/analyze_exp014.py judges it: each hop along the chain raises the
# median p50 by more than the star arms' own spread (at least 1 µs).
kind: experiment
id: exp-014
metrics:
  # vxprobe exports cumulative quantiles; a trial's value is the last sample, which equals the
  # probe-summary.json the notebook reads.
  - { id: p50, kind: gauge, unit: s, entity: measurements/probe, series: vxprobe_rtt_seconds,
      labels: { quantile: "0.5" } }
  - { id: lost, kind: counter, unit: "1", entity: measurements/probe, series: vxprobe_lost_total }
  - { id: sent, kind: counter, unit: "1", entity: measurements/probe, series: vxprobe_sent_total }
  - { id: loss_pct, kind: gauge, unit: "%", entity: measurements/probe, ratio: [lost, sent],
      factor: 100 }
criteria:
  - id: hops
    all:
      - id: fr-over-fl
        op: gt
        lhs: { diff: [{ metric: p50, aggregate: median, select: { arm: chain-fr } }, { metric: p50, aggregate: median, select: { arm: chain-fl } }] }
        rhs: { max: [{ diff: [{ max: [{ metric: p50, aggregate: median, select: { arm: star-fl } }, { metric: p50, aggregate: median, select: { arm: star-fr } }, { metric: p50, aggregate: median, select: { arm: star-rl } }] }, { min: [{ metric: p50, aggregate: median, select: { arm: star-fl } }, { metric: p50, aggregate: median, select: { arm: star-fr } }, { metric: p50, aggregate: median, select: { arm: star-rl } }] }] }, { value: 0.000001, unit: s }] }
      - id: rl-over-fr
        op: gt
        lhs: { diff: [{ metric: p50, aggregate: median, select: { arm: chain-rl } }, { metric: p50, aggregate: median, select: { arm: chain-fr } }] }
        rhs: { max: [{ diff: [{ max: [{ metric: p50, aggregate: median, select: { arm: star-fl } }, { metric: p50, aggregate: median, select: { arm: star-fr } }, { metric: p50, aggregate: median, select: { arm: star-rl } }] }, { min: [{ metric: p50, aggregate: median, select: { arm: star-fl } }, { metric: p50, aggregate: median, select: { arm: star-fr } }, { metric: p50, aggregate: median, select: { arm: star-rl } }] }] }, { value: 0.000001, unit: s }] }
campaign:
  arms: { star-fl: {}, star-fr: {}, star-rl: {}, chain-fl: {}, chain-fr: {}, chain-rl: {} }
