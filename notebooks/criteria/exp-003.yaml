# exp-003's H4 as notebooks/analyze_exp003.py judges it: the OTA burst raises the median p50 by no
# more than the larger IQR of the two arms (at least 1 µs), one-sided, and is UNRELIABLE
# (inconclusive) when either arm lost more than 1 % in any repetition.
kind: experiment
id: exp-003
hypothesis: { id: H4, statement: An OTA burst does not compromise the ADAS slice. }
metrics:
  # vxprobe exports cumulative quantiles; a trial's value is the last sample, which equals the
  # probe-summary.json the notebook reads.
  - { id: p50, kind: gauge, unit: s, entity: measurements/probe, series: vxprobe_rtt_seconds,
      labels: { quantile: "0.5" } }
  - { id: lost, kind: counter, unit: "1", entity: measurements/probe, series: vxprobe_lost_total }
  - { id: sent, kind: counter, unit: "1", entity: measurements/probe, series: vxprobe_sent_total }
  - { id: loss_pct, kind: gauge, unit: "%", entity: measurements/probe, ratio: [lost, sent],
      factor: 100 }
criteria:
  - id: h4
    op: le
    lhs: { diff: [{ metric: p50, aggregate: median, select: { arm: ota-burst } }, { metric: p50, aggregate: median, select: { arm: baseline } }] }
    rhs: { max: [{ metric: p50, aggregate: iqr, select: { arm: baseline } }, { metric: p50, aggregate: iqr, select: { arm: ota-burst } }, { value: 0.000001, unit: s }] }
    guards:
      - { id: h4-baseline-loss, op: le, lhs: { metric: loss_pct, aggregate: max, select: { arm: baseline } },
          rhs: { value: 1.0, unit: "%" } }
      - { id: h4-ota-burst-loss, op: le, lhs: { metric: loss_pct, aggregate: max, select: { arm: ota-burst } },
          rhs: { value: 1.0, unit: "%" } }
campaign:
  arms: { baseline: {}, ota-burst: {} }
