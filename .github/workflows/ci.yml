name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything checkable without the vxedge binaries. Fast, no secrets, always runnable.
  runners:
    name: campaign runners + notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Static checks
        # shellcheck *including* SC2154 (referenced but never assigned), plus each runner's
        # preamble executed under `set -u`. Both exist for a real regression: on 2026-07-31 an
        # edit removed the two lines resolving `$RESULTS` from run-exp-001.sh, `bash -n` passed
        # it, and the campaign died on the first real run after a sudo prompt and a build. The
        # preamble check is the stronger half — it runs the script, so it also catches a
        # variable assigned only in a branch that never executes.
        run: ./scripts/lib/check-runners.sh

  # Every experiment workspace must satisfy the same checks `vxedge experiment up` runs before
  # provisioning: cross-file joins *and* model invariants. A workspace that validates only on
  # the author's laptop is not a workspace anyone else can run.
  workspaces:
    name: workspace validation (cross-repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: vxperiments
      - name: Install pinned vxedge release
        # No cross-repo checkout, no build: the validator is the released x86_64 binary named in
        # ci/vxedge-release.txt. Its sha256 is checked against that checked-in file, then its
        # build provenance is verified against the vxedge release workflow. Bumping the validator
        # is a one-line change to that file.
        working-directory: vxperiments
        env:
          # The job's own read-only token, only for the attestation lookup. The release download
          # itself is anonymous.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' ci/vxedge-release.txt)
          sha256=$(sed -n 's/^sha256=//p' ci/vxedge-release.txt)
          archive="vxedge-${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/vxedge/vxedge/releases/download/v${version}/${archive}"
          echo "${sha256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          gh attestation verify "$RUNNER_TEMP/$archive" --repo vxedge/vxedge \
            --signer-workflow vxedge/vxedge/.github/workflows/release.yml
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$archive"
          echo "VXEDGE=$RUNNER_TEMP/vxedge-${version}-x86_64-unknown-linux-gnu/vxedge" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vxedge-${version}-x86_64-unknown-linux-gnu/vxedge" --version
      - name: Validate every workspace
        working-directory: vxperiments
        run: |
          set -euo pipefail
          for ws in experiments/*-ws; do
            echo "== $ws"
            "$VXEDGE" manifest validate --manifest "$ws" --json | tee /tmp/result.json
            jq -e '.valid == true and .kind == "workspace"' /tmp/result.json > /dev/null
          done
          # The retired §6.1 manifests are provenance, not inputs: they must NOT validate as
          # workspaces, and a day when they do means something resurrected the old schema.
          for m in experiments/retired-6.1/*.yaml; do
            if "$VXEDGE" manifest validate --manifest "$m" >/dev/null 2>&1; then
              echo "error: $m validated — §6.1 is supposed to be unreadable" >&2
              exit 1
            fi
          done
          echo "== retired §6.1 manifests correctly refused"
