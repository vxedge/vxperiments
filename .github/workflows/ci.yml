name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything checkable without the vxedge binaries. Fast, no secrets, always runnable.
  static:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Static checks
        run: |
          set -euo pipefail
          shellcheck -S warning scripts/*.sh
          python3 -m py_compile scripts/*.py

  # Every experiment workspace must satisfy the same checks `vxedge experiment up` runs before
  # provisioning: cross-file joins *and* model invariants. A workspace that validates only on
  # the author's laptop is not a workspace anyone else can run.
  workspaces:
    name: workspace validation (cross-repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: vxperiments
      - name: Install pinned vxedge release
        # No cross-repo checkout, no build: the validator is the released x86_64 binary named in
        # ci/vxedge-release.txt. Its sha256 is checked against that checked-in file, then its
        # build provenance is verified against the vxedge release workflow. Bumping the validator
        # is a one-line change to that file.
        working-directory: vxperiments
        env:
          # The job's own read-only token, only for the attestation lookup. The release download
          # itself is anonymous.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' ci/vxedge-release.txt)
          sha256=$(sed -n 's/^sha256=//p' ci/vxedge-release.txt)
          archive="vxedge-${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/vxedge/vxedge/releases/download/v${version}/${archive}"
          echo "${sha256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          gh attestation verify "$RUNNER_TEMP/$archive" --repo vxedge/vxedge \
            --signer-workflow vxedge/vxedge/.github/workflows/release.yml
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$archive"
          echo "VXEDGE=$RUNNER_TEMP/vxedge-${version}-x86_64-unknown-linux-gnu/vxedge" >> "$GITHUB_ENV"
          echo "VXEDGED=$RUNNER_TEMP/vxedge-${version}-x86_64-unknown-linux-gnu/vxedged" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vxedge-${version}-x86_64-unknown-linux-gnu/vxedge" --version
      - name: Validate every workspace
        working-directory: vxperiments
        run: |
          set -euo pipefail
          # A workspace is any experiment folder holding a descriptor: a `vxp/1` `vxp.yaml`, or a
          # legacy `<name>.vxp`. Folders without one are listed, not validated: they are scripts
          # against a reference vehicle, not packages, until they are migrated.
          shopt -s nullglob
          validated=0
          for ws in experiments/*/; do
            ws=${ws%/}
            descriptors=("$ws"/vxp.yam[l] "$ws"/*.vxp)   # a pattern, so nullglob drops a missing one
            if [ ${#descriptors[@]} -eq 0 ]; then
              echo "== $ws: no descriptor, not a workspace yet"
              continue
            fi
            echo "== $ws"
            "$VXEDGE" manifest validate --manifest "$ws" --json | tee /tmp/result.json
            jq -e '.valid == true and .kind == "workspace"' /tmp/result.json > /dev/null
            if [ -f "$ws/vxp.yaml" ]; then
              # A `vxp/1` package: its lock matches, and packing it twice gives one digest.
              "$VXEDGE" --chdir "$ws" pkg validate
              rm -rf /tmp/pack-a /tmp/pack-b && mkdir -p /tmp/pack-a /tmp/pack-b
              a=$("$VXEDGE" --chdir "$ws" pkg pack --out /tmp/pack-a | sed -n 's/^digest //p')
              b=$("$VXEDGE" --chdir "$ws" pkg pack --out /tmp/pack-b | sed -n 's/^digest //p')
              [ -n "$a" ] && [ "$a" = "$b" ] || { echo "error: $ws packs to $a and $b" >&2; exit 1; }
              echo "   package digest $a"
            fi
            validated=$((validated + 1))
          done
          [ "$validated" -gt 0 ] || { echo "error: no workspace validated" >&2; exit 1; }
          echo "== $validated workspaces validated"
      - name: Plan every package's campaign
        # `campaign plan` for the default and every declared profile, against an unprivileged
        # vxedged on this runner: the same checks `campaign start` makes before any trial (typed
        # intent, bounds, profiles, the trial list). Planning touches nothing, so no privilege.
        working-directory: vxperiments
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          sock="$RUNNER_TEMP/vxedged.sock"
          "$VXEDGED" --listen "unix://$sock" --runtime-dir "$RUNNER_TEMP/rt" \
            --cache-dir "$RUNNER_TEMP/cache" > "$RUNNER_TEMP/vxedged.log" 2>&1 &
          trap 'kill %1 2>/dev/null || true' EXIT
          for _ in $(seq 60); do [ -S "$sock" ] && break; sleep 0.5; done
          [ -S "$sock" ] || { cat "$RUNNER_TEMP/vxedged.log"; exit 1; }
          for pkg in $(scripts/packages.py list); do
            for profile in "" $(scripts/packages.py profiles "$pkg"); do
              echo "== $pkg ${profile:-(default)}"
              out=$("$VXEDGE" --endpoint "unix://$sock" --chdir "$pkg" campaign plan --profile "$profile" 2>&1) \
                || { echo "$out"; exit 1; }
              echo "$out" | tail -1
            done
          done
      - name: Catalogue is current
        # catalog.yaml is generated from the packages. A package version a release published
        # is immutable: a changed package needs a new version.
        working-directory: vxperiments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=()
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -n "$tag" ] && gh api "repos/$GITHUB_REPOSITORY/contents/catalog.yaml?ref=$tag" \
              -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/published.yaml" 2>/dev/null; then
            echo "versions published by $tag are immutable"
            base=(--base "$RUNNER_TEMP/published.yaml")
          fi
          scripts/packages.py catalog --check "${base[@]}"
      - name: Verdict parity
        # vxedge's verdict engine, judging each package's criteria, must give the published
        # verdict on every full published dataset that holds samples. The archives come from the
        # pinned Zenodo record, each checked against scripts/parity/SHA256SUMS before it is read.
        working-directory: vxperiments
        run: scripts/verdict-parity.sh --fetch
      - name: Scenario proof
        # A package carrying the reference scenario validates, locks and packs to one digest.
        working-directory: vxperiments
        run: scripts/scenario-proof.sh
