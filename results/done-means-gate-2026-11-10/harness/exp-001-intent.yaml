# Gate package only (X8.4): exp-001's typed intent, measurement, telemetry service and campaign,
# appended to a scratch copy of experiments/exp-001-ws/main.yaml in place of its `method` block.
# The exp-001 workspace itself is unchanged; its migration is X9.2.
hypothesis: { id: H1, statement: The ADAS slice keeps p99 within 2x of idle under infotainment load. }
parameters:
  load_mbps: { type: integer, unit: Mbit/s, default: 0, min: 0, max: 1000,
               binds: "traffic_profiles[infotainment-load].bandwidth_mbps" }
metrics:
  - { id: p99, kind: gauge, unit: s, entity: measurements/ctl-rtt, series: vxprobe_rtt_seconds,
      labels: { quantile: "0.99" } }
  - { id: lost, kind: counter, unit: "1", entity: measurements/ctl-rtt, series: vxprobe_lost_total }
  - { id: sent, kind: counter, unit: "1", entity: measurements/ctl-rtt, series: vxprobe_sent_total }
  - { id: loss_pct, kind: gauge, unit: "%", entity: measurements/ctl-rtt, ratio: [lost, sent],
      factor: 100 }
criteria:
  - id: h1
    all:
      - id: h1-p99
        lhs: { metric: p99, aggregate: median, select: { arm: saturated } }
        op: le
        rhs: { metric: p99, aggregate: median, select: { arm: idle }, factor: 2.0 }
      - id: h1-loss
        lhs: { metric: loss_pct, aggregate: median, select: { arm: saturated } }
        op: le
        rhs: { metric: loss_pct, aggregate: median, select: { arm: idle }, offset: 0.5 }
measurements:
  ctl-rtt: { kind: rtt-probe, from: node-adas-probe-01, to: internet, slice: adas, rate_pps: 1000 }
services:
  telemetry:
    id: telemetry-01
    type: telemetry
    image: { url: local/vxtelemetry:host-process, kind: container }
    config: { interval_s: 2, duration_s: 60 }
campaign:
  arms:
    idle: { load_mbps: 0 }
    saturated: { load_mbps: 600 }
  sweep: { load_mbps: [0, 100, 250, 400, 600] }
  repetitions: 5
  warmup_s: 10
  duration_s: 60
  profiles:
    quick: { repetitions: 1, warmup_s: 5, duration_s: 20 }
    repro: { repetitions: 5 }
    gate: { repetitions: 3, warmup_s: 5, duration_s: 20 }
