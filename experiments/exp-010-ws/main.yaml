kind: experiment
id: exp-010

# H2: the same vehicle measured over real 5G slices (`mode: s-nssai`, Open5GS/UERANSIM)
# instead of static VLANs. Only this file changes between H1 and H2 — the vehicle is
# provably identical, which is what makes the comparison a controlled one.
vehicles: [vx-h2-vehicle]
baseline: bl-exp-010

network:
  defaults:
    bandwidth: 500000000        # 500 mbit root rate — same shared bottleneck framing as exp-001
  slices:
    - id: adas
      mode: s-nssai
      s_nssai: { sst: 1, sd: '000001' }
      qos: { min_rate_mbps: 100, max_rate_mbps: 200, priority: 1 }
    - id: infotainment
      mode: s-nssai
      s_nssai: { sst: 2, sd: '000002' }
      qos: { min_rate_mbps: 0, max_rate_mbps: 400, priority: 5 }

traffic_profiles:
  infotainment-load:
    source: internet
    target: node-infot-load-01
    bandwidth_mbps: 400             # load_mbps binds this; the campaign sweeps 0..600
    payload_bytes: 1200

results:
  artifact_dir: results/exp-010
  upload: false

# Typed intent (ARCHITECTURE.md §6.0.3). This replaces what scripts/run.sh and
# notebooks/analyze_exp010.py held: the load sweep, repetitions and windows, the probe, and H2's
# acceptance rule (H2_TOLERANCE = 1.10 of exp-001's own p99 growth).
hypothesis:
  id: H2
  statement: Real S-NSSAI slicing isolates the ADAS slice at least as well as exp-001's static VLAN mapping.

# The only values a caller may change between trials.
parameters:
  load_mbps: { type: integer, unit: Mbit/s, default: 0, min: 0, max: 1000,
               binds: "traffic_profiles[infotainment-load].bandwidth_mbps" }
  probe_pps: { type: integer, unit: 1/s, default: 1000, min: 10, max: 5000,
               binds: "measurements[ctl-rtt].rate_pps" }

# The probe run.sh drove through TrafficService: a UE end on the s-nssai `adas` slice, whose
# address the 5G core assigns at `up` (vxedge 0.20.0). The reflector runs in the UE and the
# sender on the data-network side, as run.sh's probe did.
measurements:
  ctl-rtt: { kind: rtt-probe, from: node-adas-probe-01, to: internet, slice: adas, rate_pps: 1000 }

# vxtelemetry collects each trial's archive.
services:
  telemetry:
    id: telemetry-01
    type: telemetry
    image: { url: local/vxtelemetry:host-process, kind: container }
    config: { interval_s: 2, duration_s: 60 }

metrics:
  - { id: p99, kind: gauge, unit: s, entity: measurements/ctl-rtt, series: vxprobe_rtt_seconds,
      labels: { quantile: "0.99" } }
  - { id: lost, kind: counter, unit: "1", entity: measurements/ctl-rtt, series: vxprobe_lost_total }
  - { id: sent, kind: counter, unit: "1", entity: measurements/ctl-rtt, series: vxprobe_sent_total }
  - { id: loss_pct, kind: gauge, unit: "%", entity: measurements/ctl-rtt, ratio: [lost, sent],
      factor: 100 }

# H2's other arm is exp-001's frozen VLAN campaign, not rerun: `results/exp-001/campaign.json`
# in this repo records it. Start the campaign with `--reference-workspace <this repo>`.
references:
  vlan: { campaign: exp-001, statement: "exp-001's static VLAN mapping, frozen" }

# H2 holds when this campaign's median p99 growth from 0 to 600 Mbit/s stays within 1.10x of
# exp-001's own growth over the same loads, the notebook's rule.
criteria:
  - id: h2
    op: le
    lhs: { ratio: [{ metric: p99, aggregate: median, select: { load_mbps: 600 } },
                   { metric: p99, aggregate: median, select: { load_mbps: 0 } }] }
    rhs: { ratio: [{ metric: p99, aggregate: median, select: { load_mbps: 600 }, reference: vlan },
                   { metric: p99, aggregate: median, select: { load_mbps: 0 }, reference: vlan }],
           factor: 1.10 }

# run.sh --repro: 5 repetitions of five loads, 10 s of load before a 60 s probe window, the same
# frame as exp-001. `quick` checks the pipeline only and is never reported: one repetition with
# run.sh --quick's 3 s and 12 s windows (a profile changes repetitions and windows only, so it keeps
# all five loads).
campaign:
  sweep: { load_mbps: [0, 100, 250, 400, 600] }
  repetitions: 5
  warmup_s: 10
  duration_s: 60
  profiles:
    quick: { repetitions: 1, warmup_s: 3, duration_s: 12 }
    repro: { repetitions: 5 }
