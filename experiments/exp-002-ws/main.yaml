kind: experiment
id: exp-002

# H3: virtual-ECU packaging (full VM via libvirt vs microVM via raw QEMU vs container/netns)
# measurably affects zone-to-gateway RTT. One variable — the packaging backend — over three
# arms carrying the identical probe payload on one slice and one subnet. No competing load:
# this measures packaging overhead in isolation.
vehicles: [vx-h3-vehicle]
baseline: bl-exp-002

# One slice, because packaging is the variable. The QoS block matches the frozen manifest so
# the HTB class the arms are shaped by is byte-for-byte the one the recorded numbers came from.
network:
  defaults:
    bandwidth: 500000000
  slices:
    - id: adas
      mode: vlan
      vlan: 101
      qos: { min_rate_mbps: 100, max_rate_mbps: 500, priority: 1 }

# No `traffic_profiles`: the arms are probed one at a time on an otherwise idle topology.

results:
  artifact_dir: results/exp-002
  upload: false

# Typed intent (ARCHITECTURE.md §6.0.3). This replaces what scripts/run.sh and
# notebooks/analyze_exp002.py held: the three arms, one up at a time, repetitions and windows, the
# probe from the host to each arm, and H3's rule (some arm's median p50 outside the container
# arm's IQR, at least 1 µs).
hypothesis: { id: H3, statement: Packaging measurably affects RTT. }

# One arm up at a time: concurrent guests contend for host CPU and show as loss that is not the
# packaging's, which invalidated exp-002b's first campaign. `isolate` brings the arm's device up
# alone; `arm_device` sets it per arm, and `arm_target` aims the probe at the same device.
isolate: node-cont-01

parameters:
  arm_device: { type: string, default: node-cont-01, binds: isolate,
                values: [node-cont-01, node-microvm-01, node-libvirt-01] }
  arm_target: { type: string, default: node-cont-01, binds: "measurements[probe].to",
                values: [node-cont-01, node-microvm-01, node-libvirt-01] }
  probe_pps: { type: integer, unit: 1/s, default: 1000, min: 10, max: 5000,
               binds: "measurements[probe].rate_pps" }

# run.sh's probe: from the host, over the slice's VLAN, to the arm's address on port 9800. The
# daemon sends from the first address of the arms' subnet (10.101.0.1, the address run.sh put on
# the uplink's VLAN by hand). The container arm's reflector is vxprobe in its namespace; a VM arm's
# is its guest's own, which its part declares, and the probe waits until it answers.
measurements:
  probe: { kind: rtt-probe, from: host, to: node-cont-01, slice: adas, rate_pps: 1000 }

# vxtelemetry collects each trial's archive.
services:
  telemetry:
    id: telemetry-01
    type: telemetry
    image: { url: local/vxtelemetry:host-process, kind: container }
    config: { interval_s: 2, duration_s: 60 }

# vxprobe exports cumulative quantiles; a trial's value is the last sample, which equals the
# probe-summary.json the notebook read.
metrics:
  - { id: p50, kind: gauge, unit: s, entity: measurements/probe, series: vxprobe_rtt_seconds,
      labels: { quantile: "0.5" } }
  - { id: lost, kind: counter, unit: "1", entity: measurements/probe, series: vxprobe_lost_total }
  - { id: sent, kind: counter, unit: "1", entity: measurements/probe, series: vxprobe_sent_total }
  - { id: loss_pct, kind: gauge, unit: "%", entity: measurements/probe, ratio: [lost, sent],
      factor: 100 }

# H3 holds when the microVM or the full VM arm's median p50 sits outside the container arm's,
# by more than the container arm's IQR and at least 1 µs: the notebook's rule.
criteria:
  - id: h3
    any:
      - id: h3-microvm
        op: outside
        lhs: { metric: p50, aggregate: median, select: { arm: microvm } }
        rhs: { metric: p50, aggregate: median, select: { arm: container } }
        tolerance: { max: [{ metric: p50, aggregate: iqr, select: { arm: container } }, { value: 0.000001, unit: s }] }
      - id: h3-libvirt
        op: outside
        lhs: { metric: p50, aggregate: median, select: { arm: libvirt } }
        rhs: { metric: p50, aggregate: median, select: { arm: container } }
        tolerance: { max: [{ metric: p50, aggregate: iqr, select: { arm: container } }, { value: 0.000001, unit: s }] }

# run.sh --repro: 5 repetitions of the three arms, 10 s before a 60 s probe window at 1000 pps.
# `quick` checks the pipeline only and is never reported: one repetition with run.sh --quick's
# 2 s and 10 s windows (a profile changes repetitions and windows only, so it keeps 1000 pps;
# run.sh --quick probed at 500).
campaign:
  arms:
    container: { arm_device: node-cont-01, arm_target: node-cont-01 }
    microvm: { arm_device: node-microvm-01, arm_target: node-microvm-01 }
    libvirt: { arm_device: node-libvirt-01, arm_target: node-libvirt-01 }
  repetitions: 5
  warmup_s: 10
  duration_s: 60
  profiles:
    quick: { repetitions: 1, warmup_s: 2, duration_s: 10 }
    repro: { repetitions: 5 }
