kind: baseline
id: bl-vx-vehicle-01

# The linux-probe guest bundle, built locally from its vxparts recipe so a fresh clone works
# with no registry access. The bundle embeds the host kernel, so it is per host and is not
# published (the GHCR copy stays private). Build it once, from the workspace root:
#
#   vxparts/parts/zone/linux/stack/probe-bundle/build.sh \
#       "$PWD/vxperiments/vehicles/vx-vehicle-01/bundle"
#
# `vehicle up` refuses with this command if ./bundle is missing. `./bundle` is git-ignored.
parts:
  - ref: ./bundle
    kind: bundle
    target_ids: fn-a
