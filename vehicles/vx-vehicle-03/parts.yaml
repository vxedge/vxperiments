kind: baseline
id: bl-vx-vehicle-03

# The probe payload is the published vxparts part, pinned by digest. The guest bundle and the capsule are
# local and per host: run ./build.sh once. `vehicle up` refuses if a part is missing.
parts:
  - ref: ./bundle
    kind: bundle
    target_ids: [fn-fl, fn-fr]
  - ref: ./capsule/reflector-capsule.wasm
    kind: wasm
    target_ids: fn-rr
  - ref: ghcr.io/vxedge/parts/agent/probe/app/vxprobe:0.1.1
    digest: sha256:b3f22650146dcae004589d311fcd8f231bd2e058f8cb50a7d2a766519210fd6d
    target_ids: [fn-rl, fn-cab, fn-hpc]
